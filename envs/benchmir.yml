# Environment for the evaluation library: dataset loading, the probes, the
# report makers, and the cache-warming driver.
#
# Exported from the environment that produced this work's numbers
# (`conda env export --no-builds`), with the `name:` and `prefix:` lines
# removed so the environment can be created under any name and any prefix:
#
#     conda env create -n benchmir-pkg -f envs/benchmir.yml
#     pip install -e third_party/BenchMIR
#
# setup.sh does both and names it $BENCHMIR_ENV (paths.yaml).
#
# This environment is CPU-only on purpose: the library's torch pin has no CUDA
# wheel for the driver this work ran against. That is why the probe jobs are
# CPU jobs, and why embedding extraction is pushed out into the two
# GPU-capable environments through subprocess workers.
channels:
  - conda-forge
dependencies:
  - _openmp_mutex=4.5
  - bzip2=1.0.8
  - ca-certificates=2026.7.22
  - icu=78.3
  - ld_impl_linux-64=2.46.1
  - libexpat=2.8.1
  - libffi=3.7.0
  - libgcc=16.2.0
  - libgomp=16.2.0
  - liblzma=5.8.3
  - libnsl=2.0.1
  - libpython=3.11.16
  - libsqlite=3.53.4
  - libstdcxx=16.2.0
  - libuuid=2.42.3
  - libxcrypt=4.4.38
  - libzlib=1.3.2
  - ncurses=6.6
  - openssl=3.6.4
  - packaging=26.3
  - pip=26.2.1
  - python=3.11.16
  - readline=8.3
  - tk=8.6.13
  - tzdata=2026c
  - wheel=0.48.0
  - zstd=1.5.7
  - pip:
      # The torch wheels below carry a local version tag (+cpu), which PyPI
      # does not serve. This index is where they come from; without it the
      # environment creation fails on torch and nothing else.
      - --extra-index-url https://download.pytorch.org/whl/cpu
