# Environment for the MuseTok tokenizer: REMI+ tokenization, the MuseTok
# pre-training run, its vocabulary builder, and the worker its adapter spawns.
#
# Exported from the environment that produced this work's numbers
# (`conda env export --no-builds`), with the `name:` and `prefix:` lines
# removed so the environment can be created under any name and any prefix:
#
#     conda env create -n musetok -f envs/musetok.yml
#
# miditoolkit is pinned to 1.0.0 and that pin is LOAD-BEARING: 1.0.1 changed
# tick handling, so the same MIDI produces a different REMI+ encoding through
# upstream's midi2corpus_strict. A cache built with the wrong version looks
# fine and trains fine -- it is just not the corpus MuseTok expects. The REMI+
# cache builder refuses to run on the wrong version rather than trust the
# caller to have picked the right environment.
channels:
  - conda-forge
dependencies:
  - _openmp_mutex=4.5
  - bzip2=1.0.8
  - ca-certificates=2026.7.22
  - icu=78.3
  - ld_impl_linux-64=2.46.1
  - libexpat=2.8.1
  - libffi=3.7.0
  - libgcc=16.2.0
  - libgomp=16.2.0
  - liblzma=5.8.3
  - libnsl=2.0.1
  - libsqlite=3.53.4
  - libstdcxx=16.2.0
  - libuuid=2.42.2
  - libxcrypt=4.4.38
  - libzlib=1.3.2
  - ncurses=6.6
  - openssl=3.6.4
  - packaging=26.3
  - pip=26.2.1
  - python=3.11.16
  - readline=8.3
  - setuptools=84.0.0
  - tk=8.6.13
  - wheel=0.48.0
  - zstd=1.5.7
  - pip:
      # The torch wheels below carry a local version tag (+cu124), which PyPI
      # does not serve. This index is where they come from; without it the
      # environment creation fails on torch and nothing else.
      - --extra-index-url https://download.pytorch.org/whl/cu124
