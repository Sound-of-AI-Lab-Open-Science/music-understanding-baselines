# Environment for Music-JEPA and MusicBERT: OctupleMIDI tokenization, both
# pre-training runs, and the workers those two model adapters spawn.
#
# Exported from the environment that produced this work's numbers
# (`conda env export --no-builds`), with the `name:` and `prefix:` lines
# removed so the environment can be created under any name and any prefix:
#
#     conda env create -n jepa-music -f envs/jepa-music.yml
#
# setup.sh does this for you and names it $JEPA_ENV (paths.yaml).
#
# The pins that matter here are torch and lightning: this environment is the
# one with a CUDA build, and it is NOT interchangeable with envs/musetok.yml --
# see THIRD_PARTY_NOTICES.md for why the split is forced rather than tidy.
channels:
  - conda-forge
dependencies:
  - _openmp_mutex=4.5
  - bzip2=1.0.8
  - ca-certificates=2026.6.17
  - ld_impl_linux-64=2.45.1
  - libexpat=2.8.1
  - libffi=3.5.2
  - libgcc=15.2.0
  - libgcc-ng=15.2.0
  - libgomp=15.2.0
  - liblzma=5.8.3
  - libnsl=2.0.1
  - libsqlite=3.53.3
  - libuuid=2.42.2
  - libxcrypt=4.4.36
  - libzlib=1.3.2
  - ncurses=6.6
  - openssl=3.6.3
  - pip=26.1.2
  - python=3.11.15
  - readline=8.3
  - setuptools=83.0.0
  - tk=8.6.13
  - wheel=0.47.0
  - zstd=1.5.7
  - pip:
      # The torch wheels below carry a local version tag (+cu124), which PyPI
      # does not serve. This index is where they come from; without it the
      # environment creation fails on torch and nothing else.
